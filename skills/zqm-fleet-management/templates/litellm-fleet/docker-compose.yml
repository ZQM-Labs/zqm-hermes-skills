# docker-compose.yml — LiteLLM proxy for the ZQM Ollama fleet (TEMPLATE)
# Run on the proxy host (recommended: 192.168.1.215 / ZQM-Node-4).
# After `docker compose up -d`, the proxy listens on :4000 with auth.
# Clients (Open WebUI, Cline, agents, scripts) point at http://<this-host>:4000
# with a key minted from LITELLM_MASTER_KEY.

services:
  litellm:
    image: ghcr.io/berriai/litellm:main
    container_name: litellm-proxy
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # UI_USERNAME: ${LITELLM_UI_USER}
      # UI_PASSWORD: ${LITELLM_UI_PASS}
    command: ["--config", "/app/config.yaml", "--detailed_debug"]

# Backends are reached over the LAN (http://192.168.1.x:11434). For safety, firewall
# :11434 on each Ollama host so ONLY this proxy host's IP can reach it
# (see firewall_lan_ollama.ps1).
