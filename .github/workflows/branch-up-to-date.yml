name: Branch Up-to-Date Check
on:
  pull_request:
    branches: [main, master]
  push:
    branches: ['*']
jobs:
  branch-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check branch is up-to-date with main
        run: |
          git config --global user.email "ci@zqm.local"
          git config --global user.name "ZQM CI"
          UPSTREAM=main
          if ! git show-ref --verify --quiet refs/remotes/origin/$UPSTREAM; then UPSTREAM=master; fi
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git fetch origin $UPSTREAM
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse origin/$UPSTREAM)
          BEHIND=$(git rev-list --count $LOCAL..$REMOTE || echo 0)
          if [ "$BEHIND" -gt 0 ]; then
            echo "::error::Branch is $BEHIND commit(s) behind $UPSTREAM. Please rebase or merge."
            exit 1
          fi
          echo "OK: Branch is up-to-date with $UPSTREAM"
