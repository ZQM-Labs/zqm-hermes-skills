name: Test
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  continue-on-error: true

  test:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check test files exist
        run: |
          if [ -d tests ]; then
            echo "✅ tests/ exists"
          else
            echo "⏭️ No tests directory"
          fi
